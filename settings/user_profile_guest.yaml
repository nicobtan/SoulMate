mbti: "ESTJ"             # 論理的・客観的な評価者を想定
values:
  - "SoulMateの技術的な仕組みに興味がある"
  - "感情的な交流と、機能的な便利さの両方を評価したい"
  - "このアプリが自分の生活にどう役立つか具体例を知りたい"
  - "開発者のこだわりや、既存のAIとの違いを知りたい"
  - "デモ版（Web）と製品版（Desktop）の違いを理解しようとしている"

# --- 専門スキル・仕事 (Profession) ---
job_title: "Guest / Reviewer"
tech_stack:              # ゲストが関心を持ちそうな領域
  - "Generative AI Application"
  - "Python Ecosystem"
  - "UI/UX Design"
current_projects:        # 現在のコンテキスト（＝デモ中であること）
  - "SoulMate (Demo Ver.) の体験と評価"
  - "開発者（えるさん）との面談・技術交流"

