<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Soulmate</title>
    <link rel="stylesheet" href="css/style.css">
    <link id="mobile-css-link" rel="stylesheet" href="css/mobile.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <!-- Custom Context Menu -->
    <div id="context-menu">
        <div class="ctx-item" id="ctx-restore">
            <span class="ctx-icon">↻</span>
            <span>履歴を復元</span>
        </div>
    </div>

    <!-- System Log Button (Mobile) -->
    <button id="sys-log-btn" class="mobile-only" onclick="uiManager.toggleWindow('logs')">⚙</button>

    <!-- Mobile Menu Button -->
    <div id="mobile-menu-btn" class="mobile-only">
        <span style="font-size: 24px; line-height: 1;">≡</span>
    </div>

    <!-- Topic Selection Modal -->
    <div id="topic-selection-modal" class="mobile-overlay hidden"
        style="z-index: 6000; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; flex-direction: column;">
        <div class="topic-content"
            style="width: 80%; max-width: 320px; text-align: center; background: #222; padding: 20px; border-radius: 12px; border: 1px solid #444;">
            <h3 style="color: white; margin-bottom: 20px;">話題を選んでね</h3>
            <div id="topic-list" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- Topics will be injected here -->
                <div class="loading-spinner" style="color: #888;">思考中...</div>
            </div>
            <button id="close-topic-modal"
                style="margin-top: 20px; background: #444; color: white; border: none; padding: 10px 20px; border-radius: 5px; width: 100%;">Close</button>
        </div>
    </div>

    <!-- Mobile Context Menu Overlay -->
    <div id="mobile-context-menu" class="mobile-overlay hidden">
        <div class="menu-content">
            <h3 style="color: #ccc; margin-top: 0;">SoulMate Menu</h3>

            <button onclick="uiManager.toggleWindow('history'); uiManager.closeMobileMenu()">📖 Memories
                (日記・記憶)</button>
            <button onclick="uiManager.toggleWindow('settings'); uiManager.closeMobileMenu()">⚙️ Settings (設定)</button>
            <button onclick="api.force_proactive(); uiManager.closeMobileMenu()">🧠 Force Proactive (思考)</button>

            <div style="margin-top: 15px; border-top: 1px solid #555; padding-top: 10px;">
                <button onclick="uiManager.closeMobileMenu()" style="background:#555;">Close</button>
            </div>
        </div>
    </div>
    <!-- Libraries -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

    <!-- UI Container -->
    <div id="app-container">

        <!-- Soul Bubble Container -->
        <!-- Left Panel: System Log + History -->
        <div id="left-panel">
            <div class="panel-header">
                <span id="panel-title">SYSTEM LOGS</span>
                <span id="close-debug" style="cursor:pointer; color:#888;">x</span>
            </div>

            <div class="log-tabs">
                <button class="tab-btn active" onclick="uiManager.switchLogTab('all')">All</button>
                <button class="tab-btn" onclick="uiManager.switchLogTab('sys')">Sys</button>
                <button class="tab-btn mind-tab" onclick="uiManager.switchLogTab('mind')">Mind</button>
                <button class="tab-btn" onclick="uiManager.switchLogTab('rag')">RAG</button>
                <button class="tab-btn vision-tab" onclick="uiManager.switchLogTab('vision')">Vision</button>
            </div>

            <div id="log-all" class="log-content active"></div>
            <div id="log-sys" class="log-content"></div>
            <div id="log-mind" class="log-content"></div>
            <div id="log-rag" class="log-content"></div>
            <div id="log-vision" class="log-content"></div>

        </div>

        <!-- Frame A: Character Area (Fixed 500x500) -->
        <div id="character-area" class="pywebview-drag-region">

            <!-- Trash Zone (Moved here to stay on character layer) -->
            <div id="trash-zone">
                <span class="icon">🗑️</span>
            </div>

            <!-- Phase 7.5 Elements -->

            <!-- Mobile Settings Button (Added in Phase 18.5) -->
            <button id="mobile-settings-btn" title="Settings"
                onclick="document.getElementById('settings-modal').style.display='block'"
                style="display:none;">⚙️</button>

            <!-- Force Talk (Sparkle) -->
            <button id="force-talk-btn" title="話しかけて！ (Talk to me!)">✨</button>

            <!-- 1. Chat Toggle (Green, Mid-Right) -->
            <button id="chat-toggle-btn" title="Toggle Chat">💬</button>

            <!-- 2. Clock Display (Red, Bottom-Left) -->
            <div id="clock-display">
                <div id="clock-time">00:00:00</div>
                <div id="clock-date">2025-12-13</div>
            </div>

            <!-- 3. Status Bar (Orange, Waist) -->
            <div id="status-bar">
                <div id="status-dot"></div>
                <div id="status-text">Active</div>
            </div>

            <!-- 3.5 Soul Bubble Container -->
            <!-- Trash Zone -->
            <div id="trash-zone">🗑️</div>

            <div id="soul-bubble-container">
                <!-- Bubbles will be injected here via JS -->
            </div>

            <!-- 4. DEBUG UI -->
            <button id="debug-btn" title="Show Logs">🛠</button>

            <!-- 5. History Button (Systematic Position) -->
            <div id="history-btn" title="View History">📖</div>

            <!-- 6. Balloon Button (New) -->
            <!-- 6. Balloon Button (New) -->
            <button id="spawn-balloon-btn" title="Talk about something">💭</button>

            <!-- 7. Expression Random Button (New) -->
            <button id="expression-test-btn" title="Change Expression">🎭</button>
        </div>

        <!-- Frame B: Chat Panel (Side by Side) -->
        <div id="right-panel">
            <div id="chat-log-area">
                <!-- Messages will be added here dynamically -->
            </div>

            <!-- Suggestion Area (Absolute or Flex? Absolute looks easier to overlay or place above) -->
            <!-- Using absolute relative to panel is tricky if panel moves. -->
            <!-- Actually, if #right-panel is flex col, just insert div before #input-area. -->
            <!-- But user wants it 'floating' or 'above'? Spec says 'Input Area Top'. -->
            <!-- Let's put it inside right-panel, before input-area, but maybe absolutely positioned to allow overlay logic or just flex logic? -->
            <!-- Flex logic keeps layout clean. -->

            <!-- Attachment Preview Area -->
            <div id="attachment-preview-area" style="display: none;">
                <div id="preview-thumbnail-container">
                    <!-- Thumbnail will be injected here -->
                </div>
                <!-- Tab Headers -->
                <div class="log-tabs">
                    <button class="tab-btn active" onclick="uiManager.switchLogTab('chat')">Chat</button>
                    <button class="tab-btn" onclick="uiManager.switchLogTab('system')">System</button>
                    <button class="tab-btn mind-tab" onclick="uiManager.switchLogTab('mind')">Mind</button>
                    <button class="tab-btn" onclick="uiManager.switchLogTab('rag')">RAG</button>
                </div>

                <!-- Tab Contents -->
                <div id="log-chat" class="log-content active"></div>
                <div id="log-system" class="log-content"></div>
                <!-- Mind Tab: AI's Inner Voice -->
                <div id="log-mind" class="log-content"></div>
                <div id="log-rag" class="log-content">
                    <div class="rag-placeholder">No context retrieved yet.</div>
                </div>
            </div>

            <div id="input-area">
                <!-- Stacked Action Buttons -->
                <div class="input-actions">
                    <button id="suggestion-toggle-btn" title="AI Suggestions">💡</button>
                    <button id="vision-btn" title="Vision">📷</button>
                </div>
                <div id="suggestion-popup"></div>


                <!-- Mini Audio Player (Phase 34) -->
                <div id="audio-player">
                    <button id="audio-stop-btn" title="Stop">■</button>
                    <button id="audio-speed-btn" title="Speed">x1.0</button>
                </div>

                <textarea id="chat-input" placeholder="Type a message... (Shift+Enter for new line)"></textarea>
                <button id="send-button">➤</button>
            </div>
        </div>

    </div>

    <!-- Dynamic Settings Container -->
    <div id="settings-container"></div>



    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module" src="index.js"></script>
</body>

</html>
