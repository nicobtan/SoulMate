<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Soulmate</title>
    <style>
        /* Base Style */
        :root {
            --chat-font-size: 13px;
        }

        html,
        body {
            background-color: transparent !important;
            background: transparent !important;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            color: white;
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        /* App Container: Flex center */
        #app-container {
            display: flex;
            justify-content: center;
            align-items: center;
            /* Vertically center */
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-color: transparent !important;
        }

        /* Character Frame (A) - 500x500 Fixed, Transparent */
        #character-area {
            width: 500px;
            height: 500px;
            /* Completely Transparent Background */
            background: rgba(0, 0, 0, 0);
            /* No border for the character itself to make it float */
            position: relative;
            pointer-events: auto;
            /* Allow interaction (zoom etc) */
            /* We don't clip overflow here so head/parts might stick out if needed, 
               but usually canvas clips. Let's keep overflow hidden for safety if canvas is 500x500 */
            overflow: visible;
            /* Visible allows buttons to be outside if needed */
            flex-shrink: 0;
            /* Prevent shrinking */
            /* Make this the drag handle */
            cursor: move;
        }

        /* Add pywebview-drag-region support assuming default handling or custom CSS */
        .pywebview-drag-region {
            -webkit-app-region: drag;
        }

        /* Exclude interactive elements from drag */
        button,
        input,
        .no-drag,
        #chat-toggle-btn,
        #debug-btn,
        #clock-display,
        #status-bar,
        #debug-panel {
            -webkit-app-region: no-drag;
            cursor: pointer;
        }

        /* --- UI Elements (Phase 7.5) --- */

        /* 1. Chat Toggle Button (Green Circle, Bottom-Right above Debug) */
        #chat-toggle-btn {
            position: absolute;
            bottom: 70px;
            /* Above Debug Button (25px + 30px height + 15px gap) */
            right: 15px;
            /* Inside frame */
            width: 50px;
            height: 50px;
            background: rgba(40, 167, 69, 0.8);
            /* Green */
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 5000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(40, 167, 69, 0.5);
        }

        #chat-toggle-btn:hover {
            transform: scale(1.1);
            background: rgba(40, 167, 69, 1.0);
        }

        /* 2. Clock Display (Red/Stylish, Bottom-Left) */
        #clock-display {
            position: absolute;
            bottom: 30px;
            /* Moved up slightly */
            left: 35px;
            /* Moved in slightly */
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 15px;
            border-radius: 10px;
            border-left: 3px solid #ff4444;
            /* Red accent */
            font-family: 'Consolas', monospace;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            backdrop-filter: blur(5px);
        }

        #clock-date {
            font-size: 10px;
            color: #ddd;
            text-align: center;
        }

        /* 3. Status Bar (Orange/Pill, Bottom-Center/Waist) */
        #status-bar {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 165, 0, 0.5);
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        #status-dot {
            width: 8px;
            height: 8px;
            background-color: #ffa500;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 165, 0, 0.7);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(255, 165, 0, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 165, 0, 0);
            }
        }

        /* 4. Debug Button (Yellow, Bottom-Right) */
        #debug-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 0, 0.2);
            border: 1px solid rgba(255, 255, 0, 0.5);
            border-radius: 50%;
            color: #ff0;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
        }

        #debug-btn:hover {
            background: rgba(255, 255, 0, 0.5);
        }

        /* Debug Panel (Left Panel Logic) */
        #left-panel {
            display: flex;
            flex-direction: column;
            width: 0;
            /* Initially hidden */
            height: 500px;
            margin-right: 10px;
            /* Gap between log and char */
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #444;
            border-radius: 8px;
            opacity: 0;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            pointer-events: auto;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            color: #0f0;
            font-family: 'Consolas', monospace;
            font-size: 12px;
        }

        #left-panel.open {
            width: 400px;
            /* Expanded Width */
            opacity: 1;
        }

        .panel-header {
            padding: 10px;
            background: #222;
            border-bottom: 1px solid #444;
            font-weight: bold;
            color: #0f0;
            flex-shrink: 0;
            /* Keep fixed */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #debug-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }


        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px solid #222;
            padding-bottom: 2px;
        }

        .log-time {
            color: #888;
            margin-right: 5px;
        }

        .log-info {
            color: #8cf;
        }

        .log-warn {
            color: #fb0;
        }

        .log-error {
            color: #f44;
        }


        /* Chat Panel (B) */
        #right-panel {
            display: flex;
            flex-direction: column;
            width: 350px;
            height: 500px;
            /* Match Character Height */
            margin-left: 40px;
            /* Increased gap to accommodate button */

            position: relative;
            /* Context for absolute children */

            width: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            pointer-events: auto;
        }

        #right-panel.open {
            width: 350px;
            opacity: 1;
        }

        #chat-log-area {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            /* Darker for readability */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px 15px 0 0;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 
           Input Area Height was 100px then 80px.
           Suggestion Area Bottom needs to clear it.
           If Input is 80px, Bottom 85px is safe.
        */

        #input-area {
            height: 80px;
            /* Slightly reduced height as suggestions take space above */
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0 0 15px 15px;
            padding: 10px;
            display: flex;
            align-items: center;
            /* or flex-start if we want button top-aligned */
        }

        /* Suggestion UI (Vertical Popup) */
        #suggestion-toggle-btn {
            position: absolute;
            bottom: 90px;
            right: 15px;
            width: 35px;
            height: 35px;
            background: rgba(255, 235, 59, 0.2);
            /* Yellow tint */
            border: 1px solid rgba(255, 235, 59, 0.5);
            border-radius: 50%;
            color: #ffe082;
            font-size: 18px;
            cursor: pointer;
            z-index: 2000;
            display: none;
            /* Hidden by default if empty */
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        #suggestion-toggle-btn:hover {
            background: rgba(255, 235, 59, 0.5);
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(255, 235, 59, 0.4);
        }

        #suggestion-popup {
            position: absolute;
            bottom: 135px;
            /* Above toggle btn (90+35+10) */
            right: 15px;
            width: 250px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 10px;
            display: none;
            /* Hidden by default */
            flex-direction: column;
            gap: 8px;
            z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            animation: slideUp 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .suggestion-chip {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            color: #eee;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            word-wrap: break-word;
        }

        .suggestion-chip:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateX(-2px);
        }

        /* Chat Messages */
        .message {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: var(--chat-font-size);
            line-height: 1.4;
            user-select: text;
            /* Allow Selection */
            -webkit-user-select: text;
            cursor: text;
            white-space: pre-wrap;
            /* Preserve newlines */
        }

        .message.system {
            background: rgba(255, 200, 0, 0.2);
            font-size: 11px;
            text-align: center;
        }

        .message.user {
            background: rgba(0, 120, 255, 0.4);
            align-self: flex-end;
        }

        .message.ai {
            background: rgba(255, 255, 255, 0.15);
            align-self: flex-start;
        }

        /* Input Controls */
        #chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            /* Adjusted radius for blocks */
            color: white;
            padding: 8px 10px;
            outline: none;
            resize: none;
            /* Disable manual resize */
            height: 100%;
            /* Fill container */
            font-family: inherit;
        }

        #chat-input:focus {
            background: rgba(255, 255, 255, 0.2);
        }

        #send-button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            font-size: 12px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        #send-button:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        #auto-reply-btn {
            background: rgba(100, 200, 255, 0.2);
            border: 1px solid rgba(100, 200, 255, 0.4);
            color: #8cf;
            width: 30px;
            height: 30px;
            font-size: 14px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        #auto-reply-btn:hover {
            background: rgba(100, 200, 255, 0.4);
            box-shadow: 0 0 5px rgba(100, 200, 255, 0.5);
        }

        /* Force Talk Button (Sparkle, Above Toggle) */
        #force-talk-btn {
            position: absolute;
            bottom: 130px;
            /* Above Chat Toggle (70 + 50 + 10) */
            right: 15px;
            width: 40px;
            /* Slightly smaller than chat toggle */
            height: 40px;
            background: rgba(255, 105, 180, 0.8);
            /* HotPink */
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 5000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        }

        #force-talk-btn:hover {
            transform: scale(1.1) rotate(15deg);
            background: rgba(255, 105, 180, 1.0);
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
        }

        .msg-timestamp {
            display: block;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-align: right;
            margin-top: 4px;
        }

        /* Settings Modal (Unchanged essentially) */
        #settings-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            background: rgba(40, 40, 40, 0.95);
            border: 1px solid #666;
            border-radius: 10px;
            padding: 20px;
            z-index: 3000;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        .setting-item {
            margin: 15px 0;
        }

        .setting-actions {
            text-align: right;
            margin-top: 20px;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        #context-menu {
            display: none;
            position: absolute;
            background-color: #f2f2f2;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 5px 0;
            min-width: 150px;
            z-index: 1000;
            pointer-events: auto;
        }

        #context-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #context-menu ul li {
            padding: 8px 15px;
            cursor: pointer;
            color: #333;
            text-shadow: none;
        }

        #context-menu ul li:hover {
            background-color: #e9e9e9;
        }

        /* Rich Link Cards */
        .link-card {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            margin-top: 5px;
            overflow: hidden;
            cursor: pointer;
            transition: background 0.2s;
            max-width: 100%;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .link-card-thumb {
            width: 80px;
            height: 80px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            background-color: #000;
        }

        .link-card-content {
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            flex: 1;
        }

        .link-card-title {
            font-weight: bold;
            font-size: 0.95em;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #eee;
        }

        .link-card-url {
            font-size: 0.75em;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-link {
            color: #4da6ff;
            text-decoration: underline;
        }

        /* Input Area Adjustments */
        #input-area {
            height: 80px;
            /* Slightly reduced height as suggestions take space above */
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0 0 15px 15px;
            padding: 10px;
            display: flex;
            align-items: center;
        }
    </style>
</head>

<body>
    <!-- Libraries -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

    <!-- UI Container -->
    <div id="app-container">
        <!-- Left Panel: System Log -->
        <div id="left-panel">
            <div class="panel-header">
                <span>SYSTEM LOGS</span>
                <span id="close-debug" style="cursor:pointer; color:#888;">x</span>
            </div>
            <div id="debug-content">
                <!-- Logs go here -->
            </div>
        </div>

        <!-- Frame A: Character Area (Fixed 500x500) -->
        <div id="character-area" class="pywebview-drag-region">
            <!-- Phase 7.5 Elements -->

            <!-- Force Talk (Sparkle) -->
            <button id="force-talk-btn" title="話しかけて！ (Talk to me!)">✨</button>

            <!-- 1. Chat Toggle (Green, Mid-Right) -->
            <button id="chat-toggle-btn" title="Toggle Chat">💬</button>

            <!-- 2. Clock Display (Red, Bottom-Left) -->
            <div id="clock-display">
                <div id="clock-time">00:00:00</div>
                <div id="clock-date">2025-12-13</div>
            </div>

            <!-- 3. Status Bar (Orange, Waist) -->
            <div id="status-bar">
                <div id="status-dot"></div>
                <div id="status-text">Active</div>
            </div>

            <!-- 4. DEBUG UI -->
            <button id="debug-btn" title="Show Logs">🛠</button>

        </div>

        <!-- Frame B: Chat Panel (Side by Side) -->
        <div id="right-panel">
            <div id="chat-log-area">
                <!-- Messages will be added here dynamically -->
            </div>

            <!-- Suggestion Area (Absolute or Flex? Absolute looks easier to overlay or place above) -->
            <!-- Using absolute relative to panel is tricky if panel moves. -->
            <!-- Actually, if #right-panel is flex col, just insert div before #input-area. -->
            <!-- But user wants it 'floating' or 'above'? Spec says 'Input Area Top'. -->
            <!-- Let's put it inside right-panel, before input-area, but maybe absolutely positioned to allow overlay logic or just flex logic? -->
            <!-- Flex logic keeps layout clean. -->

            <!-- Suggestion UI -->
            <button id="suggestion-toggle-btn" title="ヒントを表示">💡</button>
            <div id="suggestion-popup">
                <!-- Chips injected here -->
            </div>

            <div id="input-area">
                <textarea id="chat-input" placeholder="メッセージを入力... (Shift+Enterで改行)"></textarea>
                <button id="send-button" title="送信">➤</button>
            </div>
        </div>
    </div>

    <div id="settings-modal"
        style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:300px; background:rgba(40,40,40,0.95); border:1px solid #666; border-radius:10px; padding:20px; z-index:3000; box-shadow:0 0 20px rgba(0,0,0,0.5);">
        <h3 style="margin-top:0; border-bottom:1px solid #555; padding-bottom:10px; color:white;">設定</h3>

        <div class="settings-group">
            <label style="color:#aaa; font-size:12px; font-weight:bold;">基本設定 (General)</label>
            <!-- Font Size -->
            <div class="setting-item" style="margin:10px 0;">
                <label style="display:block; margin-bottom:5px; color:white;">フォントサイズ (Font Size)</label>
                <input type="range" id="font-size-range" min="10" max="24" value="13" style="width:100%;">
                <span id="font-size-value" style="color:white;">13px</span>
            </div>
            <!-- Background Opacity -->
            <div class="setting-item" style="margin:10px 0;">
                <label style="display:block; margin-bottom:5px; color:white;">背景の濃さ (Opacity)</label>
                <input type="range" id="bg-opacity-range" min="0" max="100" value="0" style="width:100%;">
                <span id="bg-opacity-value" style="color:white;">0%</span>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #555; margin: 15px 0;">

        <div class="settings-group">
            <label style="color:#aaa; font-size:12px; font-weight:bold;">Brain (AI知能)</label>

            <!-- API Key -->
            <div style="margin-bottom: 10px;">
                <label style="display:block; margin-bottom:5px; font-size:12px; color:white;">Google Gemini API
                    Key</label>
                <input type="password" id="api-key-input" placeholder="Enter API Key here..."
                    style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #555; background: #333; color: white;">
            </div>

            <!-- Model Selection -->
            <div style="margin-bottom: 10px;">
                <label style="display:block; margin-bottom:5px; font-size:12px; color:white;">Model</label>
                <select id="model-select"
                    style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #555; background: #333; color: white;">
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                </select>
            </div>

            <!-- Persona Selection -->
            <div style="margin-bottom: 5px;">
                <label style="display:block; margin-bottom:5px; font-size:12px; color:white;">Persona</label>
                <select id="persona-select"
                    style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #555; background: #333; color: white;">
                    <option value="default">Default SoulMate</option>
                </select>
            </div>
        </div>

        <div style="text-align: right; margin-top: 20px;">
            <button id="settings-save-btn" class="no-drag"
                style="background: #28a745; color: white; padding: 6px 15px; border: none; border-radius: 4px; margin-right: 10px; cursor:pointer;">保存
                (Save)</button>
            <button id="settings-save-btn" style="display:none"></button>
            <!-- Fallback/Backup ID if TS logic is weird -->
            <!-- We fixed TS logic to look for 'save-btn' in settings window, but here used 'settings-save-btn'. 
                Wait, settings.html uses 'save-btn'. This is index.html Modal. 
                Existing JS logic handles this? I'll leave as is for now and check TS. -->
            <button id="settings-close-btn" class="no-drag"
                style="background:#666; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">閉じる</button>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu">
        <ul>
            <li id="menu-settings">設定</li>
            <li id="menu-close">終了</li>
