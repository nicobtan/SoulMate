<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Soulmate</title>
    <style>
        /* Base Style */
        :root {
            --chat-font-size: 13px;
        }

        html,
        body {
            background-color: transparent !important;
            background: transparent !important;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            color: white;
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        /* App Container: Flex center */
        #app-container {
            display: flex;
            justify-content: center;
            align-items: center;
            /* Vertically center */
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-color: transparent !important;
        }

        /* Character Frame (A) - 500x500 Fixed, Transparent */
        #character-area {
            width: 500px;
            height: 500px;
            /* Completely Transparent Background */
            background: rgba(0, 0, 0, 0);
            /* No border for the character itself to make it float */
            position: relative;
            pointer-events: auto;
            /* Allow interaction (zoom etc) */
            /* We don't clip overflow here so head/parts might stick out if needed, 
               but usually canvas clips. Let's keep overflow hidden for safety if canvas is 500x500 */
            overflow: visible;
            /* Visible allows buttons to be outside if needed */
            flex-shrink: 0;
            /* Prevent shrinking */
            /* Make this the drag handle */
            cursor: move;
        }

        /* Add pywebview-drag-region support */
        .pywebview-drag-region {
            -webkit-app-region: drag;
        }

        /* Drag Logic: Disable drag generally to allow selection, enable on character */
        body,
        #app-container {
            -webkit-app-region: no-drag;
        }

        #character-area {
            /* 既存のプロパティを維持しつつ、サイズ関連を強化 */
            width: 500px !important;
            height: 500px !important;
            min-width: 500px !important;
            min-height: 500px !important;
            flex-shrink: 0 !important;
            /* 絶対に縮ませない */

            position: relative;
            background: rgba(0, 0, 0, 0);
            overflow: visible;
            /* 内部パーツ（バルーン等）のはみ出しは許可 */
            cursor: move;
            -webkit-app-region: drag;
        }

        /* Soul Bubble Container */
        #soul-bubble-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Let clicks pass through empty space */
            z-index: 1000;
        }

        /* Soul Bubble Item */
        .soul-bubble {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            transition: opacity 0.5s ease-out, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), width 0.6s, height 0.6s, border-radius 0.6s;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            pointer-events: auto;

            /* Initial State */
            transform: scale(0) translateY(0);
            opacity: 0;
            /* No default animation, use class */
        }

        /* Visible State (Popped In) */
        .soul-bubble.appeared {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Floating Animation - MUST include scale(1) to maintain size */
        @keyframes gentleFloat {

            0%,
            100% {
                transform: scale(1) translateY(0);
            }

            50% {
                transform: scale(1) translateY(-15px);
            }
        }



        /* Color Modifiers */
        .bubble-blue {
            background: #3498db;
            color: white;
        }

        .bubble-green {
            background: #2ecc71;
            color: white;
        }

        .bubble-pink {
            background: #e91e63;
            color: white;
        }

        .bubble-orange {
            background: #f39c12;
            color: white;
        }

        /* Expanded State (Clicked) */
        .soul-bubble.expanded {
            width: 250px;
            height: 80px;
            border-radius: 16px;
            padding: 0 15px;
            z-index: 1001;
            /* Bring to front */
        }

        /* Content Visibility */
        .bubble-content {
            display: flex;
            align-items: center;
            justify-content: center;
            /* Center by default */
            gap: 0;
            /* No gap by default */
            width: 100%;
            height: 100%;
        }

        /* When expanded, we add gap and left-align */
        .soul-bubble.expanded .bubble-content {
            justify-content: flex-start;
            gap: 12px;
        }

        .soul-bubble .text {
            display: none;
            /* Hide completely when collapsed */
            opacity: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.3s 0.2s;
        }

        .soul-bubble.expanded .text {
            display: block;
            opacity: 1;
        }

        .soul-bubble .icon {
            font-size: 20px;
            /* Reduced from 24px */
            flex-shrink: 0;
            /* Move icon slightly up if needed for optical alignment vs background? */
            /* transform: translateY(-1px); */
        }



        /* Exclude interactive elements from drag */
        button,
        input,
        .no-drag,
        #chat-toggle-btn,
        #debug-btn,
        #clock-display,
        #status-bar,
        #debug-panel {
            -webkit-app-region: no-drag;
            cursor: pointer;
        }

        /* --- UI Elements (Phase 7.5) --- */

        /* 1. Chat Toggle Button (Green, Mid-Right) */
        #chat-toggle-btn {
            position: absolute;
            bottom: 70px;
            /* Stack Middle */
            right: 10px;
            /* Aligned */
            width: 50px;
            height: 50px;
            background: rgba(40, 167, 69, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 5000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(40, 167, 69, 0.5);
        }

        #chat-toggle-btn:hover {
            transform: scale(1.1);
            background: rgba(40, 167, 69, 1.0);
        }

        /* 2. Clock Display (Red/Stylish, Bottom-Left) */
        #clock-display {
            position: absolute;
            bottom: 15px;
            /* Moved up slightly */
            left: 15px;
            /* Moved in slightly */
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 15px;
            border-radius: 10px;
            border-left: 3px solid #ff4444;
            /* Red accent */
            font-family: 'Consolas', monospace;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            backdrop-filter: blur(5px);
        }

        #clock-date {
            font-size: 10px;
            color: #ddd;
            text-align: center;
        }

        /* 3. Status Bar (Orange/Pill, Bottom-Center/Waist) */
        #status-bar {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 165, 0, 0.5);
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        #status-dot {
            width: 8px;
            height: 8px;
            background-color: #ffa500;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 165, 0, 0.7);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(255, 165, 0, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 165, 0, 0);
            }
        }

        /* 4. Debug Button (Yellow, Bottom-Right) */
        #debug-btn {
            position: absolute;
            bottom: 10px;
            /* Stack Bottom */
            right: 10px;
            /* Aligned */
            width: 50px;
            /* Unified Size */
            height: 50px;
            /* Unified Size */
            background: rgba(255, 255, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            /* Unified Border */
            border-radius: 50%;
            color: #ff0;
            font-size: 24px;
            /* Unified Font */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
            z-index: 5000;
            /* Unified Z */
            box-shadow: 0 0 10px rgba(255, 255, 0, 0.2);
        }

        #debug-btn:hover {
            background: rgba(255, 255, 0, 0.5);
        }

        /* 5. History Button (Cyan, Next to Debug) */
        #history-btn {
            position: absolute;
            bottom: 10px;
            right: 70px;
            /* Left of debug btn */
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: #0ff;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
            z-index: 5000;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        #history-btn:hover {
            background: rgba(0, 255, 255, 0.5);
            transform: scale(1.1);
        }

        /* 6. Balloon Button (White/Thought, Left of History) */
        #spawn-balloon-btn {
            position: absolute;
            bottom: 10px;
            right: 130px;
            /* Left of history btn (70+50+10) */
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: #fff;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
            z-index: 5000;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        #spawn-balloon-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }

        #debug-btn:hover {
            background: rgba(255, 255, 0, 0.5);
        }

        /* Debug Panel (Left Panel Logic) */
        #left-panel {
            display: flex;
            flex-direction: column;
            width: 0;
            /* Initially hidden */
            height: 500px;
            margin-right: 10px;
            /* Gap between log and char */
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #444;
            border-radius: 8px;
            opacity: 0;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            pointer-events: auto;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            color: #0f0;
            font-family: 'Consolas', monospace;
            font-size: 12px;

            /* Allow text selection */
            user-select: text;
            -webkit-user-select: text;
        }

        #left-panel.open {
            width: 400px;
            /* Expanded Width */
            opacity: 1;
        }

        .panel-header {
            padding: 10px;
            background: #222;
            border-bottom: 1px solid #444;
            font-weight: bold;
            color: #0f0;
            flex-shrink: 0;
            /* Keep fixed */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #debug-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: block;
            /* Default visible */
        }

        #history-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: none;
            /* Hidden by default */
            border-top: 1px solid #444;
            /* Sep from header if needed */
        }

        /* History Item Styling (Systematic) */
        .hist-entry {
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
            font-family: 'Consolas', monospace;
            font-size: 11px;
        }

        .hist-meta {
            color: #888;
            margin-bottom: 2px;
        }

        .hist-user {
            color: #8cf;
        }

        .hist-ai {
            color: #ddd;
            margin-left: 10px;
        }

        #history-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: none;
            /* Hidden by default */
            border-top: 1px solid #444;
            /* Sep from header if needed */
        }

        /* History Item Styling (Systematic) */
        .hist-entry {
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
            font-family: 'Consolas', monospace;
            font-size: 11px;
        }

        .hist-meta {
            color: #888;
            margin-bottom: 2px;
        }

        .hist-user {
            color: #8cf;
        }

        .hist-ai {
            color: #ddd;
            margin-left: 10px;
        }


        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px solid #222;
            padding-bottom: 2px;
        }

        .log-time {
            color: #888;
            margin-right: 5px;
        }

        .log-info {
            color: #8cf;
        }

        .log-warn {
            color: #fb0;
        }

        .log-error {
            color: #f44;
        }

        /* --- Log Filtering Logic --- */
        /* Default: Show All if no class, or view-all */

        /* View: Sys (System only) -> Hide rag, dbg */
        #debug-content.view-sys .cat-rag,
        #debug-content.view-sys .cat-dbg {
            display: none;
        }

        /* View: RAG (RAG only) -> Hide sys, dbg */
        #debug-content.view-rag .cat-sys,
        #debug-content.view-rag .cat-dbg {
            display: none;
        }

        /* View: Dbg (Debug only) -> Show All or specific? Usually Dbg includes everything or just debug? */
        /* Let's assume Dbg tab shows EVERYTHING including SYS and RAG for deep debugging, 
           OR just 'dbg' category? 
           User request implies 'RAG tab' shows RAG logs. 
           Let's make each tab exclusive for clarity, or Dbg inclusive.
           If cat-dbg is used for verbose stuff, maybe Dbg tab shows cat-dbg.
           Let's stick to exclusive for now based on typical UI patterns. */
        #debug-content.view-dbg .cat-sys,
        #debug-content.view-dbg .cat-rag {
            display: none;
        }

        /* Ensure RAG items are visible in RAG tab */
        #debug-content.view-rag .cat-rag {
            display: block;
        }


        /* Chat Panel (B) */
        #right-panel {
            display: flex;
            flex-direction: column;
            width: 450px;
            height: 500px;
            /* Match Character Height */
            margin-left: 40px;
            /* Increased gap to accommodate button */

            position: relative;
            /* Context for absolute children */

            width: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            pointer-events: auto;
        }

        #right-panel.open {
            width: 450px;
            opacity: 1;
        }

        #chat-log-area {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            /* Darker for readability */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px 15px 0 0;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 
           Input Area Height was 100px then 80px.
           Suggestion Area Bottom needs to clear it.
           If Input is 80px, Bottom 85px is safe.
        */

        #input-area {
            height: 80px;
            /* Slightly reduced height as suggestions take space above */
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0 0 15px 15px;
            padding: 10px;
            display: flex;
            align-items: center;
            /* or flex-start if we want button top-aligned */
            position: relative;
            /* Context for button absolute positioning */
        }



        /* Audio Player UI */
        #audio-player {
            display: none;
            /* Flex when active */
            position: absolute;
            /* Floating inside input area? or outside? */
            /* Let's float it just above the input area, right aligned */
            bottom: 90px;
            right: 0px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 5px 10px;
            gap: 10px;
            z-index: 2000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: opacity 0.3s;
        }

        #audio-player.visible {
            display: flex;
            animation: fadeIn 0.3s;
        }

        #audio-player button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Consolas', monospace;
            padding: 2px 5px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        #audio-player button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #audio-stop-btn {
            color: #ff4444;
        }

        /* Suggestion UI (Vertical Popup) */
        #log-modal {
            display: none;
            /* Flex on active */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            /* Overlay */
            backdrop-filter: blur(5px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #log-modal.visible {
            opacity: 1;
        }

        .modal-card {
            width: 600px;
            max-width: 90%;
            height: 80%;
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        #log-modal.visible .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #ddd;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #fff;
        }

        #log-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Log Item Styling */
        .log-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 10px;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-meta {
            font-size: 10px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }

        .log-msg {
            font-size: 13px;
            line-height: 1.4;
        }

        .log-msg.user {
            color: #8cf;
        }

        .log-msg.ai {
            color: #ddd;
        }

        /* Suggestion UI (Vertical Popup) */
        /* Suggestion UI (Now inside Input Area for Desktop) */
        #suggestion-toggle-btn {
            /* Position relative in flex container */
            position: relative;
            bottom: auto;
            right: auto;
            width: 30px;
            height: 30px;
            margin-right: 8px;
            /* Gap to input */

            background: rgba(255, 235, 59, 0.2);
            border: 1px solid rgba(255, 235, 59, 0.5);
            border-radius: 50%;
            color: #ffe082;
            font-size: 16px;
            cursor: pointer;
            z-index: 2000;
            display: none;
            /* JS toggles flex */
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        #suggestion-toggle-btn:hover {
            background: rgba(255, 235, 59, 0.5);
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(255, 235, 59, 0.4);
        }

        #suggestion-popup {
            position: absolute;
            bottom: 135px;
            /* Above toggle btn (90+35+10) */
            right: 15px;
            width: 250px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 10px;
            display: none;
            /* Hidden by default */
            flex-direction: column;
            gap: 8px;
            z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            animation: slideUp 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Discovery Mode (Purple/Star) */
        .soul-bubble.bubble-discovery {
            background: radial-gradient(circle at 30% 30%, #a855f7, #6b21a8);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.4);
        }

        /* Removed ::after to use standard icon system */
        /*.soul-bubble.bubble-discovery::after {
            content: '✨';
        }*/

        /* Trash Zone */
        #trash-zone {
            position: absolute;
            /* 【変更点】内側の左上に配置 */
            top: 10px;
            left: 10px;

            width: 60px;
            /* 少しコンパクトに調整 */
            height: 60px;
            border-radius: 50%;

            /* 視認性向上のためのスタイル */
            background: rgba(0, 0, 0, 0.6);
            /* 半透明の黒背景を追加 */
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 68, 68, 0.3);
            /* 薄い赤枠 */

            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            /* アイコンサイズ調整 */

            opacity: 0;
            /* 通常時は非表示 */
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 9000;
        }

        /* ドラッグ中などの表示状態 */
        #trash-zone.visible {
            opacity: 1 !important;
            pointer-events: auto;
            background: rgba(50, 0, 0, 0.8);
        }

        #trash-zone.active {
            opacity: 1;
            transform: scale(1.1);
            background: rgba(200, 0, 0, 0.8);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }

        .soul-bubble.dragging {
            cursor: grabbing;

            pointer-events: none;
            transition: opacity 0.3s;
        }

        .mobile-mode #left-panel.open {
            opacity: 1;
            pointer-events: auto;
        }

        /* Suggestion Popup */
        /* Suggestion Popup */
        .mobile-mode #suggestion-popup {
            position: fixed;
            /* FIXED POSITION IS CRITICAL */
            bottom: 37vh;
            right: 10px;
            width: 85vw;
            max-width: 350px;
            z-index: 10000 !important;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            /* Spacing between chips */
        }

        .mobile-mode .suggestion-chip {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #eee;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .mobile-mode .suggestion-chip:active {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
        }

        /* Buttons */
        .mobile-mode #chat-toggle-btn {
            display: none;
        }

        .mobile-mode #force-talk-btn {
            width: 60px;
            height: 60px;
            font-size: 28px;
            position: fixed;
            /* Fixed to screen */
            bottom: 37vh;
            /* Just above chat panel */
            right: 20px;
            z-index: 9999 !important;
            pointer-events: auto;
        }

        /* Prevent Chat Log from expanding infinitely */
        .mobile-mode #chat-log-area {
            height: calc(100% - 90px);
            /* Subtract input area height */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            /* Ensure it doesn't cover input */
        }

        .mobile-mode #right-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            /* Align input to bottom */
        }

        .mobile-mode #input-area {
            flex-shrink: 0;
            /* Input stays fixed size */
        }

        /* Custom Context Menu */
        #context-menu {
            position: absolute;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 5px 0;
            min-width: 150px;
            z-index: 10000;
            display: none;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .ctx-item {
            padding: 8px 15px;
            cursor: pointer;
            color: #ddd;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .ctx-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .ctx-icon {
            font-size: 14px;
            color: #8cf;
            /* Cyan accent */
        }

        /* Animation */
        @keyframes fadeInMenu {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        #context-menu.visible {
            display: block;
            animation: fadeInMenu 0.1s ease-out;
        }
    </style>
</head>

<body>


    <!-- Custom Context Menu -->
    <div id="context-menu">
        <div class="ctx-item" id="ctx-restore">
            <span class="ctx-icon">↻</span>
            <span>履歴を復元</span>
        </div>
    </div>
    <!-- Libraries -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

    <!-- UI Container -->
    <div id="app-container">

        <!-- Soul Bubble Container -->
        <!-- Left Panel: System Log + History -->
        <div id="left-panel">
            <div class="panel-header">
                <span id="panel-title">SYSTEM LOGS</span>
                <span id="close-debug" style="cursor:pointer; color:#888;">x</span>
            </div>

            <div id="debug-tabs" class="log-tabs">
                <div class="log-tab active" data-view="view-all">All</div>
                <div class="log-tab" data-view="view-sys">Sys</div>
                <div class="log-tab" data-view="view-rag">RAG</div>
                <div class="log-tab" data-view="view-dbg">Dbg</div>
            </div>

            <div id="debug-content" class="view-all">
            </div>
            <div id="history-content" style="display:none;"></div>
        </div>

        <!-- Frame A: Character Area (Fixed 500x500) -->
        <div id="character-area" class="pywebview-drag-region">

            <!-- Trash Zone (Moved here to stay on character layer) -->
            <div id="trash-zone">
                <span class="icon">🗑️</span>
            </div>

            <!-- Phase 7.5 Elements -->

            <!-- Mobile Settings Button (Added in Phase 18.5) -->
            <button id="mobile-settings-btn" title="Settings"
                onclick="document.getElementById('settings-modal').style.display='block'"
                style="display:none;">⚙️</button>

            <!-- Force Talk (Sparkle) -->
            <button id="force-talk-btn" title="話しかけて！ (Talk to me!)">✨</button>

            <!-- 1. Chat Toggle (Green, Mid-Right) -->
            <button id="chat-toggle-btn" title="Toggle Chat">💬</button>

            <!-- 2. Clock Display (Red, Bottom-Left) -->
            <div id="clock-display">
                <div id="clock-time">00:00:00</div>
                <div id="clock-date">2025-12-13</div>
            </div>

            <!-- 3. Status Bar (Orange, Waist) -->
            <div id="status-bar">
                <div id="status-dot"></div>
                <div id="status-text">Active</div>
            </div>

            <!-- 3.5 Soul Bubble Container -->
            <!-- Trash Zone -->
            <div id="trash-zone">🗑️</div>

            <div id="soul-bubble-container">
                <!-- Bubbles will be injected here via JS -->
            </div>

            <!-- 4. DEBUG UI -->
            <button id="debug-btn" title="Show Logs">🛠</button>

            <!-- 5. History Button (Systematic Position) -->
            <div id="history-btn" title="View History">📖</div>

            <!-- 6. Balloon Button (New) -->
            <div id="spawn-balloon-btn" title="Talk about something">💭</div>
        </div>

        <!-- Frame B: Chat Panel (Side by Side) -->
        <div id="right-panel">
            <div id="chat-log-area">
                <!-- Messages will be added here dynamically -->
            </div>

            <!-- Suggestion Area (Absolute or Flex? Absolute looks easier to overlay or place above) -->
            <!-- Using absolute relative to panel is tricky if panel moves. -->
            <!-- Actually, if #right-panel is flex col, just insert div before #input-area. -->
            <!-- But user wants it 'floating' or 'above'? Spec says 'Input Area Top'. -->
            <!-- Let's put it inside right-panel, before input-area, but maybe absolutely positioned to allow overlay logic or just flex logic? -->
            <!-- Flex logic keeps layout clean. -->

            <!-- Suggestion UI -->
            <!-- Suggestion UI -->
            <div id="suggestion-popup">
                <!-- Chips injected here -->
            </div>

            <div id="input-area">
                <!-- Stacked Action Buttons -->
                <div class="input-actions">
                    <button id="suggestion-toggle-btn" title="AI Suggestions">💡</button>
                    <button id="vision-btn" title="Vision">📷</button>
                </div>
                <div id="suggestion-popup"></div>


                <!-- Mini Audio Player (Phase 34) -->
                <div id="audio-player">
                    <button id="audio-stop-btn" title="Stop">■</button>
                    <button id="audio-speed-btn" title="Speed">x1.0</button>
                </div>

                <textarea id="chat-input" placeholder="Type a message... (Shift+Enter for new line)"></textarea>
                <button id="send-button">➤</button>
            </div>
        </div>



        <!-- Settings Modal -->
    </div>

    <div id="settings-modal"
        style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:300px; background:rgba(40,40,40,0.95); border:1px solid #666; border-radius:10px; padding:20px; z-index:3000; box-shadow:0 0 20px rgba(0,0,0,0.5);">
        <h3 style="margin-top:0; border-bottom:1px solid #555; padding-bottom:10px; color:white;">設定</h3>

        <div class="settings-group">
            <label style="color:#aaa; font-size:12px; font-weight:bold;">基本設定 (General)</label>
            <!-- Font Size -->
            <div class="setting-item" style="margin:10px 0;">
                <label style="display:block; margin-bottom:5px; color:white;">フォントサイズ (Font Size)</label>
                <input type="range" id="font-size-range" min="10" max="24" value="13" style="width:100%;">
                <span id="font-size-value" style="color:white;">13px</span>
            </div>
            <!-- Background Opacity -->
            <div class="setting-item" style="margin:10px 0;">
                <label style="display:block; margin-bottom:5px; color:white;">背景の濃さ (Opacity)</label>
                <input type="range" id="bg-opacity-range" min="0" max="100" value="0" style="width:100%;">
                <span id="bg-opacity-value" style="color:white;">0%</span>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #555; margin: 15px 0;">

        <div class="settings-group">
            <label style="color:#aaa; font-size:12px; font-weight:bold;">Brain (AI知能)</label>

            <!-- API Key -->
            <div style="margin-bottom: 10px;">
                <label style="display:block; margin-bottom:5px; font-size:12px; color:white;">Google Gemini API
                    Key</label>
                <input type="password" id="api-key-input" placeholder="Enter API Key here..."
                    style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #555; background: #333; color: white;">
            </div>

            <!-- Model Selection -->
            <div style="margin-bottom: 10px;">
                <label style="display:block; margin-bottom:5px; font-size:12px; color:white;">Model</label>
                <select id="model-select"
                    style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #555; background: #333; color: white;">
                    <option value="gemini-2.5-flash-lite" selected>Gemini 2.5 Flash Lite (Fast)</option>
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                </select>
            </div>

            <!-- Persona Selection -->
            <div style="margin-bottom: 5px;">
                <label style="display:block; margin-bottom:5px; font-size:12px; color:white;">Persona</label>
                <select id="persona-select"
                    style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #555; background: #333; color: white;">
                    <option value="default">Default SoulMate</option>
                </select>
            </div>
        </div>

        <div style="text-align: right; margin-top: 20px;">
            <button id="settings-save-btn" class="no-drag"
                style="background: #28a745; color: white; padding: 6px 15px; border: none; border-radius: 4px; margin-right: 10px; cursor:pointer;">保存
                (Save)</button>
            <button id="settings-save-btn" style="display:none"></button>
            <!-- Fallback/Backup ID if TS logic is weird -->
            <!-- We fixed TS logic to look for 'save-btn' in settings window, but here used 'settings-save-btn'. -->
            <button id="settings-close-btn" class="no-drag"
                onclick="document.getElementById('settings-modal').style.display='none'"
                style="background:#666; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">閉じる</button>
        </div>
    </div>



    <script type="module" src="index.js"></script>
</body>
