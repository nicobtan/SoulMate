<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulMate Memories</title>
    <style>
        :root {
            --bg-color: #2b2b2b;
            --text-color: #e0e0e0;
            --accent-color: #4a90e2;
            --sidebar-color: #1e1e1e;
            --border-color: #444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar: Session List */
        .sidebar {
            width: 240px;
            background-color: var(--sidebar-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding-top: 10px;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 15px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .session-item {
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .session-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .session-item.active {
            background: rgba(74, 144, 226, 0.1);
            border-left: 3px solid var(--accent-color);
        }

        .session-info {
            flex: 1;
            overflow: hidden;
        }

        .session-date {
            font-size: 10px;
            color: #888;
        }

        .session-title {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Item Actions */
        .session-actions {
            display: flex;
            gap: 5px;
            opacity: 0.5;
        }

        .session-item:hover .session-actions {
            opacity: 1;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #666;
            padding: 2px;
            font-size: 14px;
        }

        .icon-btn:hover {
            color: white;
        }

        .icon-btn.fav-btn.active {
            color: #ffd700;
        }

        .icon-btn.del-btn:hover {
            color: #ff4444;
        }

        /* Content Area */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
        }

        .chat-view {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .footer {
            padding: 15px;
            border-top: 1px solid #444;
            text-align: right;
            background: var(--sidebar-color);
        }

        /* Messages */
        .msg {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
        }

        .msg.user {
            align-self: flex-end;
            background: rgba(0, 120, 255, 0.3);
        }

        .msg.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
        }

        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            background: var(--accent-color);
            color: white;
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="header-title">Memories 📖</div>
            <div class="search-row">
                <input type="text" id="search-input" placeholder="キーワード検索...">
                <button id="fav-filter-btn" title="お気に入りのみ">★</button>
            </div>
        </div>
        <div id="session-list">
            <div style="padding:20px; color:#888;">Loading...</div>
        </div>
    </div>
    <div class="content">
        <div class="chat-view" id="chat-view">
            <div style="color:#888; margin:auto;">左のリストから会話を選択してください</div>
        </div>
        <div class="footer">
            <button id="resume-btn" class="btn" disabled>この会話の続きをする ⏩</button>
        </div>
    </div>
    <script type="module" src="history.js"></script>
</body>

</html>
