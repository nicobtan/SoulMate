# ゲストユーザープロファイル (SoulMateデモ・レビュー用)

# --- 基本情報 (Basic Info) ---
# ※アプリ側でゲストの名前入力があった場合、ここを置換してください
name: "{guest_name}"     # 例: 田中 様
gender: "Unknown"        # 性別不詳（相手に合わせて柔軟に対応）
birthday: null           # 初対面なので不明
location: "Online"       # Web上のどこか
language: "Japanese"

# --- 性格・価値観 (Personality) ---
